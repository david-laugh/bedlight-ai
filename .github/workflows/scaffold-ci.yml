name: scaffold-ci

# Repository 골격 검증. 현재 단계에서 실제로 실행 가능한 검사만 포함한다.
#  - 필수 디렉터리/파일 존재
#  - JSON Schema 자체 유효성 (Draft 2020-12)
#  - Docker Compose 설정 유효성
#  - Docker 이미지 빌드 가능 여부
#  - 컨테이너 기동 smoke test (broker pub/sub 왕복, 정적 페이지 응답, placeholder 프로세스 생존)
#    ※ placeholder 컨테이너가 떠 있다는 것은 "기능 동작"을 의미하지 않는다.

on:
  push:
    branches: [main, master, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check required directories and files
        run: bash scripts/check_structure.sh

  schemas:
    name: JSON Schema validity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements-ci.txt
      - name: Validate schemas against Draft 2020-12 metaschema
        run: python scripts/validate_contracts.py --schemas-only

  compose:
    name: Compose config, build, smoke
    runs-on: ubuntu-24.04
    needs: [structure]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config (default)
        run: docker compose config --quiet

      - name: Validate compose config (profile test)
        run: docker compose --profile test config --quiet

      - name: Build all images (incl. profile test)
        run: docker compose --profile test build

      - name: Start broker and simulator placeholder
        run: docker compose up -d --wait --wait-timeout 90 mqtt-broker simulator-web

      - name: MQTT pub/sub round trip
        run: |
          docker compose exec -T mqtt-broker sh -c '
            mosquitto_sub -h 127.0.0.1 -t "bedlight/v1/ci/ping" -C 1 -W 10 > /tmp/recv &
            sleep 1
            mosquitto_pub -h 127.0.0.1 -t "bedlight/v1/ci/ping" -q 1 -m "ping"
            wait
            test "$(cat /tmp/recv)" = "ping"'

      - name: Simulator dashboard responds
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>BedLight AI Simulator</title>"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "/ws"

      - name: Controller and db-writer start
        run: |
          mkdir -p runtime-data/db-writer runtime-data/audio
          VOICE_UID=$(id -u); VOICE_GID=$(id -g); export VOICE_UID VOICE_GID
          docker compose up -d --wait --wait-timeout 90 controller db-writer
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/api/v1/state | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['light']['auto_control'] is False"
          test "$(docker inspect -f '{{.State.Status}}' bedlight-db-writer)" = "running"
          docker compose logs db-writer | grep -q "DRY-RUN"

      - name: Voice service - upload synthetic WAV and verify persistence
        env:
          VOICE_DATASET_DIR: ${{ runner.temp }}/voice-data
        run: |
          mkdir -p "$VOICE_DATASET_DIR"
          VOICE_UID=$(id -u); VOICE_GID=$(id -g); export VOICE_UID VOICE_GID
          docker compose up -d --wait --wait-timeout 90 voice-service
          curl -fsS http://127.0.0.1:8001/health
          # SYNTHETIC test tone (pipeline check only, never training data)
          python3 -c "import sys,math; sys.path.insert(0,'services/voice-service'); from app.wav_utils import write_pcm16_wav; write_pcm16_wav('/tmp/synthetic.wav',[int(6000*math.sin(2*math.pi*440*i/16000)) for i in range(32000)],16000)"
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -F audio=@/tmp/synthetic.wav -F label=off \
            -F device_id=ci-runner -F capture_id=ci-${{ github.run_id }}-0001 -F sample_rate=16000 \
            http://127.0.0.1:8001/api/v1/recordings)
          cat /tmp/resp.json; echo
          test "$code" = "201"
          rel=$(python3 -c "import json; print(json.load(open('/tmp/resp.json'))['relative_path'])")
          test -f "$VOICE_DATASET_DIR/$rel"
          # persistence across container restart
          docker compose restart voice-service
          docker compose up -d --wait --wait-timeout 90 voice-service
          curl -fsS http://127.0.0.1:8001/api/v1/recordings/stats | tee /tmp/stats.json
          python3 -c "import json; assert json.load(open('/tmp/stats.json'))['labels']['off']['files'] == 1"
          # bad file is rejected
          code=$(curl -s -o /dev/null -w '%{http_code}' -F audio=@README.md -F label=off -F device_id=ci-runner \
            -F capture_id=ci-${{ github.run_id }}-0002 -F sample_rate=16000 http://127.0.0.1:8001/api/v1/recordings)
          test "$code" = "422"

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
