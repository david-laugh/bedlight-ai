# BedLight AI — Docker Compose
#
# 현재 단계: Fall(Vision) -> LISTENING -> 런타임 오디오 청크 파이프라인.
#   - mqtt-broker   : Mosquitto (개발용 무인증). ESP32 접속 시 .env 에 MQTT_BIND_ADDR=0.0.0.0 필요
#   - voice-service : 학습 녹음 업로드 + 런타임 오디오 청크 수신/검증/재구성 (:8001, LAN). KWS 추론 미구현
#   - controller    : MQTT 상태 집계, WebSocket(:8000) -> simulator, 수동 조명 제어. 자동 소등 미구현
#   - db-writer     : MQTT 이벤트 -> 검증/중복제거 -> Supabase (자격증명 없으면 DRY-RUN 로컬 파일)
#   - simulator-web : 정적 대시보드 (:8080)
#   - mock-device   : profile "test", 펌웨어 0.3 프로토콜 재현 (source=mock, 합성 오디오)
#
# 사용:
#   docker compose up -d --build                 # 기본 서비스
#   docker compose --profile test up --build     # mock-device 포함
#
# 보안: voice-service(8001) 를 제외한 host 포트는 127.0.0.1 에만 바인딩한다.
#       voice-service 는 ESP32 업로드를 위해 LAN 에 노출되므로 VOICE_UPLOAD_TOKEN 사용 권장.
#       무인증 MQTT 포트와 8001 을 인터넷에 노출하지 말 것. docs/security.md 참고.

name: bedlight-ai

x-mqtt-env: &mqtt-env
  MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-bedlight/v1}
  CONTRACT_VERSION: "1"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0.20
    container_name: bedlight-mqtt-broker
    restart: unless-stopped
    ports:
      # ESP32 (LAN) must reach the broker: set MQTT_BIND_ADDR=0.0.0.0 in .env (anonymous dev broker - LAN only,
      # never port-forward). Default stays localhost-only.
      - "${MQTT_BIND_ADDR:-127.0.0.1}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-p", "1883", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [bedlight-net]

  controller:
    build:
      context: ./services/controller
    image: bedlight/controller:dev
    container_name: bedlight-controller
    restart: unless-stopped
    environment:
      <<: *mqtt-env
      SERVICE_NAME: controller
      ROOM_ID: ${ROOM_ID:-bedroom-01}
      VOICE_SERVICE_URL: http://voice-service:8001
    ports:
      - "127.0.0.1:${CONTROLLER_PORT:-8000}:8000"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks: [bedlight-net]

  voice-service:
    build:
      context: ./services/voice-service
    image: bedlight/voice-service:dev
    container_name: bedlight-voice-service
    restart: unless-stopped
    # Linux: set VOICE_UID/VOICE_GID to `id -u`/`id -g` so recordings are owned by you.
    # Windows/macOS Docker Desktop: ownership is not enforced, defaults are fine.
    user: "${VOICE_UID:-1000}:${VOICE_GID:-1000}"
    # ESP32 is a separate device on the LAN, so this port is bound to all interfaces by default.
    # Protect it with VOICE_UPLOAD_TOKEN and never port-forward it to the internet (docs/security.md).
    ports:
      - "${VOICE_BIND_ADDR:-0.0.0.0}:${VOICE_HOST_PORT:-8001}:8001"
    environment:
      VOICE_DATA_DIR: /data/voice
      VOICE_RUNTIME_DIR: /data/runtime
      VOICE_MODEL_DIR: /models
      VOICE_UPLOAD_TOKEN: ${VOICE_UPLOAD_TOKEN:-}
      VOICE_ALLOWED_LABELS: off,unknown,noise
      VOICE_SAMPLE_RATE: "16000"
      VOICE_MIN_DURATION_MS: ${VOICE_MIN_DURATION_MS:-500}
      VOICE_MAX_DURATION_MS: ${VOICE_MAX_DURATION_MS:-10000}
      VOICE_MAX_UPLOAD_BYTES: ${VOICE_MAX_UPLOAD_BYTES:-1000000}
    volumes:
      # Bind mount: recordings persist on the PC in datasets/voice/ across container restarts.
      - ${VOICE_DATASET_DIR:-./datasets/voice}:/data/voice
      # Runtime (Fall-triggered) audio chunks - kept separate from the training dataset.
      - ${VOICE_RUNTIME_HOST_DIR:-./runtime-data/audio}:/data/runtime
      # Future Edge Impulse Linux (.eim) model deployment location (read-only).
      - ./models/voice/deploy:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [bedlight-net]

  db-writer:
    build:
      context: ./services/db-writer
      additional_contexts:
        contracts: ./contracts
    image: bedlight/db-writer:dev
    container_name: bedlight-db-writer
    restart: unless-stopped
    # Supabase secret key 는 db-writer 에만 주입한다 (controller/simulator 에는 주입 금지).
    env_file:
      - path: .env
        required: false
    environment:
      <<: *mqtt-env
      SERVICE_NAME: db-writer
      DB_WRITER_DRYRUN_FILE: /data/db-writer/events.jsonl
    user: "${VOICE_UID:-1000}:${VOICE_GID:-1000}"
    volumes:
      # DRY-RUN output when Supabase credentials are absent (nothing is sent to Supabase then).
      - ${DB_WRITER_HOST_DIR:-./runtime-data/db-writer}:/data/db-writer
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks: [bedlight-net]

  simulator-web:
    build:
      context: ./services/simulator-web
    image: bedlight/simulator-web:dev
    container_name: bedlight-simulator-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIMULATOR_HOST_PORT:-8080}:80"
    networks: [bedlight-net]

  mock-device:
    profiles: ["test"]
    build:
      context: ./tests/mock-device
    image: bedlight/mock-device:dev
    container_name: bedlight-mock-device
    restart: "no"
    environment:
      <<: *mqtt-env
      SERVICE_NAME: mock-device
      MOCK_DEVICE_ID: ${MOCK_DEVICE_ID:-mock-xiao-01}
      MOCK_EVENT_SOURCE: mock
      VOICE_SERVICE_URL: http://voice-service:8001
      ROOM_ID: ${ROOM_ID:-bedroom-01}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      voice-service:
        condition: service_healthy
    networks: [bedlight-net]

volumes:
  mosquitto-data:

networks:
  bedlight-net:
    name: bedlight-net
