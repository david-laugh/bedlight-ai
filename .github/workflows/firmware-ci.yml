name: firmware-ci

# XIAO ESP32S3 Sense 펌웨어 (Arduino CLI, ESP32 Core 2.0.x 고정).
#  - host-tests : wav_header.h 를 g++ 로 단위 테스트하고, 생성한 합성 WAV 를 scripts/check_wav.py 로 교차 검증
#  - compile    : bedlight.ino 컴파일 (config.h 는 CI 에서 config.example.h 로부터 생성 — 실제 비밀값 없음)
#
# 정책: 스케치(.ino)가 없으면 compile job 은 "skipped" 로 표시되며 성공으로 위장하지 않는다.
#       실제 하드웨어 녹음/업로드는 CI 로 검증할 수 없다 (docs/test-plan.md 수동 테스트 H1~H6).

on:
  push:
    branches: [main, master, release]
    paths:
      - "firmware/**"
      - "models/**"
      - "services/voice-service/app/wav_utils.py"
      - "scripts/check_wav.py"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "models/**"
      - "services/voice-service/app/wav_utils.py"
      - "scripts/check_wav.py"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect firmware sketch
    runs-on: ubuntu-24.04
    outputs:
      has_sketch: ${{ steps.detect.outputs.has_sketch }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          set -a; source firmware/xiao-esp32s3-sense/toolchain.env; set +a
          if compgen -G "$SKETCH_DIR/*.ino" > /dev/null; then
            echo "has_sketch=true" >> "$GITHUB_OUTPUT"
            echo "Firmware sketch found in \`$SKETCH_DIR\` → compile job will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_sketch=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Firmware NOT compiled"
              echo "No \`.ino\` sketch in \`$SKETCH_DIR\`. The compile job is **skipped** (not passed)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  host-tests:
    name: WAV header host tests (g++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and run test_wav_header
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/xiao-esp32s3-sense/bedlight \
            firmware/xiao-esp32s3-sense/tests/test_wav_header.cpp -o /tmp/test_wav_header
          /tmp/test_wav_header /tmp/firmware_header_synthetic.wav
      - name: Cross-check firmware WAV with the server-side validator
        run: python scripts/check_wav.py --strict /tmp/firmware_header_synthetic.wav
      - name: State machine tests (Fall -> LISTENING, 5 s hold/extend, scenarios A-D, millis wrap)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror             -I firmware/xiao-esp32s3-sense/bedlight             firmware/xiao-esp32s3-sense/tests/test_state_manager.cpp -o /tmp/test_state_manager
          /tmp/test_state_manager

  compile:
    name: Compile WITHOUT vision model (BEDLIGHT_VISION_ENABLED=0, not a vision integration check)
    needs: detect
    if: needs.detect.outputs.has_sketch == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned toolchain
        run: grep -E '^[A-Z0-9_]+=' firmware/xiao-esp32s3-sense/toolchain.env >> "$GITHUB_ENV"

      - name: Guard core version is 2.0.x
        run: |
          [[ "$ESP32_CORE_VERSION" =~ ^2\.0\.[0-9]+$ ]] || { echo "ESP32_CORE_VERSION must be 2.0.x"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps for esptool / gen_esp32part (Core 2.0.x calls python3)
        run: pip install pyserial

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE_VERSION }}

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_BOARD_MANAGER_URL"
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli core list

      - name: Install Edge Impulse libraries (if present)
        run: |
          shopt -s nullglob
          zips=("$EI_LIBRARY_DIR"/*.zip)
          if [[ ${#zips[@]} -eq 0 ]]; then
            echo "No Edge Impulse library zip in $EI_LIBRARY_DIR (Vision model not yet exported)."
          fi
          for z in "${zips[@]}"; do
            echo "Installing $z"
            arduino-cli lib install --zip-path "$z"
          done

      - name: Create CI config.h from template (no real credentials, vision disabled)
        run: sed 's/#define BEDLIGHT_VISION_ENABLED 1/#define BEDLIGHT_VISION_ENABLED 0/' "$SKETCH_DIR/config.example.h" > "$SKETCH_DIR/config.h"

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile --fqbn "$FQBN" --warnings all --output-dir build "$SKETCH_DIR" 2>&1 | tee build/compile.log
          grep -E "Sketch uses|Global variables" build/compile.log >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: bedlight-firmware-novision-${{ github.sha }}
          path: |
            build/*.bin
            build/compile.log
          if-no-files-found: error

  ei-library:
    name: Edge Impulse library availability
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          EI_API_KEY: ${{ secrets.EI_API_KEY }}
        run: |
          if [[ -n "$EI_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vision firmware NOT compiled"
              echo "Secret \`EI_API_KEY\` is not set, so the Edge Impulse Arduino library (Fall/Standing FOMO,"
              echo "project 1155470) cannot be downloaded. The \`compile-vision\` job is **skipped (not passed)**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  compile-vision:
    name: Compile WITH Edge Impulse FOMO library (vision integration)
    needs: [detect, ei-library]
    if: needs.detect.outputs.has_sketch == 'true' && needs.ei-library.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned toolchain
        run: grep -E '^[A-Z0-9_]+=' firmware/xiao-esp32s3-sense/toolchain.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyserial
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE_VERSION }}
      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_BOARD_MANAGER_URL"
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
      - name: Fetch Edge Impulse Arduino library
        env:
          EI_API_KEY: ${{ secrets.EI_API_KEY }}
          EI_PROJECT_ID: ${{ vars.EI_PROJECT_ID || '1155470' }}
        run: bash scripts/fetch_ei_arduino_library.sh /tmp/ei-lib.zip
      - name: Install library and verify model metadata
        run: |
          arduino-cli lib install --zip-path /tmp/ei-lib.zip
          meta=$(find ~/Arduino/libraries -path '*model-parameters/model_metadata.h' | head -1)
          grep -E "EI_CLASSIFIER_OBJECT_DETECTION +1|EI_CLASSIFIER_INPUT_WIDTH +96|EI_CLASSIFIER_LABEL_COUNT +2" "$meta"
          test -d ~/Arduino/libraries/Fall_detection_system_for_workers_in_industry_inferencing
      - name: Compile with vision
        run: |
          cp "$SKETCH_DIR/config.example.h" "$SKETCH_DIR/config.h"
          mkdir -p build
          arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir build "$SKETCH_DIR" 2>&1 | tee build/compile.log
          grep -E "Sketch uses|Global variables" build/compile.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bedlight-firmware-vision-${{ github.sha }}
          path: |
            build/*.bin
            build/compile.log
          if-no-files-found: error
