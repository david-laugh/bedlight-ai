# BedLight AI — Mosquitto 개발용 설정 (DEV ONLY)
#
# !! 경고 !!
#   이 설정은 무인증(allow_anonymous true)이다.
#   compose.yaml 에서 host 포트를 127.0.0.1 에만 바인딩하여 로컬 개발에서만 사용한다.
#   이 설정으로 1883 포트를 공유기 포트포워딩/클라우드 보안그룹 등으로 인터넷에 공개하지 말 것.
#   실제 ESP32 를 LAN 에서 연결할 때는 mosquitto.auth.conf.example 기반 인증 설정을 사용한다.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# 컨테이너 내부에서는 모든 인터페이스에서 수신. 외부 노출 범위는 compose 포트 바인딩으로 제한.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# 이벤트 페이로드 상한 (JSON 이벤트는 수 KB 이내 예상). 이미지/오디오 원본은 MQTT 로 전송하지 않는다.
message_size_limit 65536
max_inflight_messages 20
max_queued_messages 1000
